<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SportHub | Eventos</title>

    <!-- Bootstrap 5.0 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="estilos.css">

</head>

<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            <i class="bi bi-trophy"></i> SportHub
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Inicio</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="eventos.html">Eventos</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="ligas.html">Ligas</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="universitario.html">Universitario</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="talento.html">Talento Mexicano</a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- TITULO -->

<section class="container py-5">

    <div class="text-center">

        <h1 id="tituloDeporte">
            Eventos deportivos
        </h1>

        <p class="text-muted">
            Consulta eventos deportivos disponibles.
        </p>

    </div>


    <!-- BUSCADOR -->

    <div class="search-box p-4 shadow-sm rounded">

        <div class="row g-3">

            <div class="col-md-6">

                <label class="form-label">
                    Deporte
                </label>

                <select id="selectorDeporte" class="form-select">

                    <option value="nba">NBA</option>

                    <option value="nfl">NFL</option>

                    <option value="mlb">MLB</option>

                    <option value="nhl">NHL</option>

                    <option value="fifa">FIFA</option>

                </select>

            </div>


            <div class="col-md-6">

                <label class="form-label">
                    Buscar
                </label>

                <input
                    type="text"
                    id="busqueda"
                    class="form-control"
                    placeholder="Buscar equipo o evento">

            </div>

        </div>

    </div>


    <!-- EVENTOS -->

    <div class="row g-4 mt-4" id="eventos">

        <div class="col-12 text-center">

            <div class="spinner-border text-primary"></div>

            <p class="mt-2">
                Cargando eventos...
            </p>

        </div>

    </div>

</section>


<!-- FOOTER -->

<footer class="bg-dark text-white text-center py-4">

    <p class="mb-0">
        © 2026 SportHub
    </p>

</footer>


<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- JavaScript -->

<script src="js/script.js"></script>

</body>
</html>
